<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Face Clicker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: score and face on the left, upgrade shop on the right; stacks to one column on phones. */
:root{
  --bg:#0e2a30;
  --panel:#15383f;
  --panel-2:#1c4a52;
  --fg:#f4f7f5;
  --muted:#9cc2c4;
  --accent:#ffb02e;
  --accent-ink:#2b1a00;
  --good:#46d9a6;
  --font-display:"Bowlby One","Arial Black",Impact,sans-serif;
  --font-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;
  padding-block:20px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  margin:0;
}
.wrap{max-width:900px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:720px){.wrap{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--panel);border-radius:18px;padding:20px;min-width:0}
h1{font-family:var(--font-display);font-weight:400;font-size:26px;letter-spacing:.01em;margin:0 0 14px;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:400;font-size:20px;margin:0 0 12px}
.score{font-family:var(--font-display);font-size:clamp(36px,9vw,52px);color:var(--accent);line-height:1;font-variant-numeric:tabular-nums}
.rates{color:var(--muted);font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums}
.stage{display:flex;justify-content:center;padding:22px 0 14px;position:relative}
.face{
  width:min(280px,72vw);aspect-ratio:1;border-radius:50%;overflow:hidden;cursor:pointer;
  border:6px solid var(--accent);background:var(--panel-2);padding:0;display:block;
  box-shadow:0 10px 0 #0a1d21;transition:transform .07s,box-shadow .07s;touch-action:manipulation;
}
.face:active,.face.pop{transform:translateY(6px) scale(.97);box-shadow:0 4px 0 #0a1d21}
.face:focus-visible{outline:3px solid var(--fg);outline-offset:4px}
.face img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none}
.float{position:fixed;font-family:var(--font-display);font-size:24px;color:var(--accent);pointer-events:none;animation:up .8s ease-out forwards;text-shadow:0 2px 0 #0a1d21;z-index:20}
@keyframes up{to{transform:translateY(-90px);opacity:0}}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.btn{font:inherit;font-weight:800;border:0;border-radius:10px;padding:9px 14px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--panel-2)}
.btn:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.badges{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;min-height:28px}
.badge{background:var(--panel-2);border-radius:99px;padding:4px 10px;font-size:13px;font-weight:800}
.badge.next{background:transparent;border:1px dashed var(--panel-2);color:var(--muted)}
.shop{display:flex;flex-direction:column;gap:10px}
.up{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center;
  width:100%;text-align:left;font:inherit;color:var(--fg);background:var(--panel-2);
  border:2px solid transparent;border-radius:12px;padding:12px 14px;cursor:pointer;
}
.up:hover:not(:disabled){border-color:var(--accent)}
.up:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.up:disabled{opacity:.5;cursor:not-allowed}
.up .name{font-weight:800}
.up .desc{grid-column:1;color:var(--muted);font-size:14px;font-weight:700}
.up .price{grid-row:1 / span 2;grid-column:2;font-family:var(--font-display);color:var(--accent);font-variant-numeric:tabular-nums}
.up .count{color:var(--good);font-weight:800;margin-left:6px}
.confirm{display:none;gap:8px;align-items:center;flex-wrap:wrap}
.confirm.on{display:flex}
@media (prefers-reduced-motion:reduce){.face,.float{transition:none;animation-duration:.01s}}
</style>

<div class="wrap">
  <section class="panel" aria-label="Game">
    <h1>Face Clicker</h1>
    <div class="score" id="score">0</div>
    <div class="rates"><span id="cps">0</span> per second · <span id="cpc">1</span> per click</div>
    <div class="stage">
      <button class="face" id="face" aria-label="Click the face to earn points"><img id="faceImg" alt=""></button>
    </div>
    <div class="row">
      <label class="btn primary" for="file" style="cursor:pointer">Change picture</label>
      <input id="file" type="file" accept="image/*" hidden>
      <button class="btn ghost" id="useDefault" hidden>Use original</button>
    </div>
    <div class="badges" id="badges"></div>
  </section>

  <section class="panel" aria-label="Upgrades">
    <h2>Upgrades</h2>
    <div class="shop" id="shop"></div>
    <div class="row">
      <button class="btn ghost" id="resetBtn">Reset game</button>
      <div class="confirm" id="confirm">
        <span>Erase all progress?</span>
        <button class="btn primary" id="yes">Yes, reset</button>
        <button class="btn ghost" id="no">Cancel</button>
      </div>
    </div>
  </section>
</div>

var defs=[
  {id:'finger',name:'Strong Finger',desc:'+1 per click',base:15,type:'click',val:1},
  {id:'fan',name:'Fan',desc:'+1 per second',base:50,type:'auto',val:1},
  {id:'double',name:'Double Tap',desc:'+5 per click',base:150,type:'click',val:5},
  {id:'club',name:'Fan Club',desc:'+8 per second',base:400,type:'auto',val:8},
  {id:'mega',name:'Mega Click',desc:'+50 per click',base:2500,type:'click',val:50},
  {id:'stadium',name:'Stadium',desc:'+50 per second',base:3000,type:'auto',val:50}
];
var goals=[[100,'100 points'],[1000,'1,000 points'],[10000,'10,000 points'],[100000,'100,000 points'],[1000000,'1 million']];
var S={score:0,total:0,owned:{}};
function $(id){return document.getElementById(id)}
try{var saved=JSON.parse(localStorage.getItem('faceclicker'));if(saved&&typeof saved.score==='number')S=saved}catch(e){}

function cost(d){return Math.floor(d.base*Math.pow(1.15,S.owned[d.id]||0))}
function cpc(){return defs.reduce(function(a,d){return a+(d.type==='click'?d.val*(S.owned[d.id]||0):0)},1)}
function cps(){return defs.reduce(function(a,d){return a+(d.type==='auto'?d.val*(S.owned[d.id]||0):0)},0)}
function fmt(n){n=Math.floor(n);if(n>=1e9)return (n/1e9).toFixed(2)+'B';if(n>=1e6)return (n/1e6).toFixed(2)+'M';if(n>=1e4)return (n/1e3).toFixed(1)+'K';return n.toLocaleString()}
function save(){try{localStorage.setItem('faceclicker',JSON.stringify(S))}catch(e){}}

/* picture */
function setImg(src){$('faceImg').src=src;$('useDefault').hidden=(src===DEFAULT_IMG)}
var custom=null;try{custom=localStorage.getItem('faceclicker_img')}catch(e){}
setImg(custom||DEFAULT_IMG);
$('file').addEventListener('change',function(e){
  var f=e.target.files[0];if(!f)return;
  var img=new Image(),url=URL.createObjectURL(f);
  img.onload=function(){
    var c=document.createElement('canvas'),m=Math.min(img.width,img.height);
    c.width=c.height=360;
    c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,360,360);
    var data=c.toDataURL('image/jpeg',.82);
    try{localStorage.setItem('faceclicker_img',data)}catch(err){}
    setImg(data);URL.revokeObjectURL(url);
  };
  img.src=url;e.target.value='';
});
$('useDefault').addEventListener('click',function(){try{localStorage.removeItem('faceclicker_img')}catch(e){}setImg(DEFAULT_IMG)});

/* clicking */
var face=$('face');
face.addEventListener('pointerdown',function(e){
  var n=cpc();S.score+=n;S.total+=n;
  face.classList.add('pop');setTimeout(function(){face.classList.remove('pop')},70);
  var p=document.createElement('div');p.className='float';p.textContent='+'+fmt(n);
  var x=(e.clientX||innerWidth/2)+(Math.random()*40-20)-14,y=(e.clientY||innerHeight/2)-24;
  p.style.left=x+'px';p.style.top=y+'px';document.body.appendChild(p);
  setTimeout(function(){p.remove()},850);
  render();
});
face.addEventListener('keydown',function(e){
  if(e.key==='Enter'||e.key===' '){e.preventDefault();face.dispatchEvent(new PointerEvent('pointerdown'))}
});

/* shop */
function buy(id){
  var d=defs.filter(function(x){return x.id===id})[0],c=cost(d);
  if(S.score>=c){S.score-=c;S.owned[id]=(S.owned[id]||0)+1;render();save()}
}
defs.forEach(function(d){
  var b=document.createElement('button');b.className='up';b.id='up_'+d.id;
  b.addEventListener('click',function(){buy(d.id)});$('shop').appendChild(b);
});

function render(){
  $('score').textContent=fmt(S.score);
  $('cps').textContent=fmt(cps());$('cpc').textContent=fmt(cpc());
  defs.forEach(function(d){
    var b=$('up_'+d.id);
    b.innerHTML='<span class="name">'+d.name+'<span class="count">×'+(S.owned[d.id]||0)+'</span></span><span class="price">'+fmt(cost(d))+'</span><span class="desc">'+d.desc+'</span>';
    b.disabled=S.score<cost(d);
  });
  var html='',next=null;
  goals.forEach(function(g){if(S.total>=g[0])html+='<span class="badge">✓ '+g[1]+'</span>';else if(!next)next=g});
  if(next)html+='<span class="badge next">Next: '+next[1]+'</span>';
  $('badges').innerHTML=html;
}
render();

setInterval(function(){var a=cps()/10;if(a){S.score+=a;S.total+=a;render()}},100);
setInterval(save,3000);

/* reset with in-page confirmation */
$('resetBtn').addEventListener('click',function(){$('resetBtn').hidden=true;$('confirm').classList.add('on')});
$('no').addEventListener('click',function(){$('confirm').classList.remove('on');$('resetBtn').hidden=false});
$('yes').addEventListener('click',function(){
  S={score:0,total:0,owned:{}};save();render();
  $('confirm').classList.remove('on');$('resetBtn').hidden=false;
});
</script>

</body></html>
